# Global mise config — polyglot runtimes + cross-language CLI tools.
#
# Division of labor on this machine:
#   - pixi  : source of truth for Python / conda (python, uv, ipython, nvitop, …)
#             and heavy C libraries that are poor `mise` fits
#             (ffmpeg, imagemagick, ghostscript, aria2, poppler, qpdf).
#   - mise  : language runtimes (node/go/rust) + prebuilt-binary CLI tools.
#
# Backend choices are all prebuilt binaries (no source compilation):
#   - `core:`  -> node/go/rust official prebuilt distributions
#   - `aqua:`  -> aqua registry (verified prebuilt release binaries, checksum-locked)
# The deprecated `ubi:` backend is intentionally avoided.

[tools]

# --- Language runtimes (core plugins, prebuilt) ---
node = "24"   # current LTS line
go = "1.26"
rust = "1.96"

# --- CLI tools (aqua: prebuilt release binaries) ---
# NOTE: btop and eza are intentionally NOT here — neither ships a
# prebuilt macOS arm64 binary (aqua btop is Linux-only; eza releases
# carry no darwin asset). They stay in `pixi global` on this machine.
"aqua:sharkdp/bat" = "latest"            # cat with syntax highlighting
"aqua:sharkdp/fd" = "latest"             # fast file finder
"aqua:junegunn/fzf" = "latest"           # fuzzy finder
"aqua:cli/cli" = "latest"                # gh, GitHub CLI
"aqua:bootandy/dust" = "latest"          # du replacement
"aqua:sharkdp/hyperfine" = "latest"      # benchmarking
"aqua:git-lfs/git-lfs" = "latest"        # git large file storage
"aqua:BurntSushi/ripgrep" = "latest"     # rg, fast grep
"aqua:phiresky/ripgrep-all" = "latest"   # rga, ripgrep over pdfs/docs
"aqua:jesseduffield/lazygit" = "latest"  # git TUI
"aqua:ducaale/xh" = "latest"             # HTTPie-like HTTP client
"aqua:starship/starship" = "latest"      # shell prompt
