# zsh plugins as plain files chezmoi refreshes weekly, so no plugin manager runs at shell start.

[".local/share/zsh/plugins/fzf-tab"]
type = "archive"
url = "https://github.com/Aloxaf/fzf-tab/archive/refs/heads/master.tar.gz"
exact = true
stripComponents = 1
refreshPeriod = "168h"

[".local/share/zsh/plugins/zsh-completions"]
type = "archive"
url = "https://github.com/zsh-users/zsh-completions/archive/refs/heads/master.tar.gz"
exact = true
stripComponents = 1
refreshPeriod = "168h"

# oh-my-zsh's git aliases and its double-Esc sudo, each a single self-contained file.
[".local/share/zsh/plugins/git.plugin.zsh"]
type = "file"
url = "https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/plugins/git/git.plugin.zsh"
refreshPeriod = "168h"

[".local/share/zsh/plugins/sudo.plugin.zsh"]
type = "file"
url = "https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/plugins/sudo/sudo.plugin.zsh"
refreshPeriod = "168h"
