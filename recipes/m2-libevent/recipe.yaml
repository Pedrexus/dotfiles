# MSYS2's libevent, which m2-tmux needs and conda-forge does not carry.
context:
  version: 2.1.13
  release: 1

package:
  name: m2-libevent
  version: ${{ version }}.${{ release }}

source:
  url: https://repo.msys2.org/msys/x86_64/libevent-${{ version }}-${{ release }}-x86_64.pkg.tar.zst
  sha256: ce967e0bbeb4cf396a42e6cd7516b6bbcef23237bf0a55099adbdfe1e9b3fce3

build:
  number: 0
  noarch: generic
  # robocopy copes with long paths; it exits below 8 on success, `ver` resets that to 0 for the
  # check rattler-build appends to every line.
  script:
    - robocopy usr "%PREFIX%\Library\usr" /E /NFL /NDL /NJH /NJS & if errorlevel 8 (exit /b 1) else (ver > nul)

requirements:
  run:
    - __win
    - m2-msys2-runtime
    - m2-filesystem
    - m2-openssl

about:
  homepage: https://libevent.org
  license: BSD-3-Clause
  summary: An event notification library, the MSYS2 build
