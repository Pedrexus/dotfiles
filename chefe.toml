# chefe.toml — one manifest for the dotfiles toolbox.
# Replaces pixi.toml + dot_config/mise + maskfile.md + package.json: conda (via
# pixi) is the single source for every CLI, cross-platform.
#
#   chefe global        → install every tool into the shared global pixi env,
#                         including the npm tooling declared in [nodejs.deps]
#   chefe run shell      → make the system zsh the default login shell

[workspace]
name      = "dotfiles"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
channels  = ["conda-forge"]

[deps]
age           = ">=1.2"
aria2         = ">=1.37.0,<2"
bat           = ">=0.26.1,<0.27"
btop          = ">=1.4.7,<2"
chezmoi       = ">=2.70.5,<3"
dust          = ">=1.2.4,<2"
eza           = ">=0.23.4,<0.24"
fd-find       = ">=10.4.2,<11"
ffmpeg        = ">=8.1.1,<9"
fzf           = ">=0.73.1,<0.74"
gh            = ">=2.93.0,<3"
ghostscript   = ">=10.4.0,<11"
git           = ">=2.50"
git-lfs       = ">=3.7.1,<4"
go            = ">=1.26.4,<2"
hyperfine     = ">=1.20.0,<2"
imagemagick   = ">=7.1.2_25,<8"
img2pdf       = ">=0.6"
ipython       = ">=9.14.1,<10"
lazygit       = ">=0.62.2,<0.63"
nodejs        = ">=26.3.0,<26.4"
nvim          = ">=0.12.2,<0.13"
nvitop        = ">=1.7.0,<2"
pandoc        = ">=3.10,<4"
parallel      = ">=20260422,<20260423"
poppler       = ">=25"
python        = ">=3.14.5,<3.15"
qpdf          = ">=12"
ripgrep       = ">=15.1.0,<16"
ripgrep-all   = ">=0.10.10,<0.11"
ruby          = ">=4.0.5,<5"
rust          = ">=1.96.0,<1.97"
speedtest-cli = ">=2.1.3,<3"
starship      = ">=1.25.1,<2"
tmux          = ">=3.5"
uv            = ">=0.11.19,<0.12"
xh            = ">=0.25.3,<0.26"

# ── nodejs (installed globally by `chefe global`; declared, never an install task) ──
[nodejs.deps]
"@anthropic-ai/claude-code" = "*"

# ── tasks (was dotfiles/maskfile.md; install/uninstall are now `chefe global`) ──
[tasks.shell]
run = '''
shell_path="$(awk '/^\/(usr\/)?bin\/zsh$/ { print; exit }' /etc/shells 2>/dev/null)"
if [ -z "$shell_path" ]; then
  echo "No system zsh in /etc/shells; install it first (e.g. sudo apt install -y zsh)" >&2
  exit 1
fi
sudo chsh -s "$shell_path" "$USER"
'''
description = "set the system zsh as the default login shell"
