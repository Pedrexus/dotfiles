# pixi-global.toml — one manifest for the dotfiles toolbox.
# This is the manifest `pixi global` itself reads. Copy it to
# $PIXI_HOME/manifests/pixi-global.toml with PIXI_HOME="$HOME/.pixi/$(uname -m)",
# then `pixi global sync` installs every CLI below, cross-platform, no sudo.
# After editing, copy it back into $PIXI_HOME/manifests/ and sync again.

version = 1

[envs.dotfiles]
channels = ["conda-forge"]

[envs.dotfiles.dependencies]
age           = ">=1.2"
aria2         = ">=1.37.0,<2"
bat           = ">=0.26.1,<0.27"
btop          = ">=1.4.7,<2"
chezmoi       = ">=2.70.5,<3"
dust          = ">=1.2.4,<2"
eza           = ">=0.23.4,<0.24"
fd-find       = ">=10.4.2,<11"
ffmpeg        = ">=8.1.1,<9"
fzf           = ">=0.73.1,<0.74"
gh            = ">=2.93.0,<3"
ghostscript   = ">=10.4.0,<11"
git           = ">=2.50"
git-lfs       = ">=3.7.1,<4"
go            = ">=1.26.4,<2"
hyperfine     = ">=1.20.0,<2"
imagemagick   = ">=7.1.2_25,<8"
img2pdf       = ">=0.6"
ipython       = ">=9.14.1,<10"
lazygit       = ">=0.62.2,<0.63"
nodejs        = ">=26.3.0,<26.4"
nvim          = ">=0.12.2,<0.13"
nvitop        = ">=1.7.0,<2"
pandoc        = ">=3.10,<4"
